server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: admin-service
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:nacos.structured.cn:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:5a4e4c1f-beda-4ae5-a3d7-428950e7473b}
        metadata:
          version: @project.version@
        group: ${NACOC_GROUP:${spring.profiles.active}}
        enabled: ${NACOS_DISCOVERY_ENABLE:false}
        username: ${NACOS_USERNAME:structure}
        password: ${NACOS_PASSWORD:structure}
      config:
        server-addr: ${NACOS_SERVER:nacos.structured.cn:8848}
        namespace: ${NACOS_NAMESPACE:5a4e4c1f-beda-4ae5-a3d7-428950e7473b}
        group: ${NACOC_GROUP:${spring.profiles.active}}
        name: ${spring.application.name}
        file-extension: yaml
        enabled: ${NACOS_CONFIG_ENABLE:false}
        username: ${NACOS_USERNAME:structure}
        password: ${NACOS_PASSWORD:structure}
  main:
    allow-circular-references: true

management:
  endpoint:
    health:
      show-details: always
  server:
    port: 7777
  health:
    mail:
      enabled: false

---
# === Dev Profile ===
spring:
  config:
    activate:
      on-profile: dev

server:
  port: 18110
  servlet:
    context-path: /admin

---
# === Pro Profile ===
spring:
  config:
    activate:
      on-profile: pro
