# 开发环境基础配置
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.context.ConfigurationPropertiesAutoConfiguration
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 数据源配置（开发环境）
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.24.20.15:3306/admin?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      pool-name: AdminHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # Redis配置（开发环境）
  data:
    redis:
      host: 172.24.20.15
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
      lettuce: 
        pool: 
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Flyway配置
  flyway:
    enabled: true
    clean-disabled: true
    table: flyway_schema_history
    out-of-order: false
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    locations: classpath:migration

  # RabbitMQ配置（开发环境）
  rabbitmq:
    host: 172.24.20.15
    port: 5672
    username: root
    password: 123456
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        prefetch: 50
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
        acknowledge-mode: manual
        default-requeue-rejected: false

  # Nacos（开发环境关闭）
  cloud:
    nacos:
      discovery:
        enabled: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# Structure配置
structure:
  security:
    resource-id: admin-service
    antMatchers:
      unAuthenticated:
        - /actuator/health
        - /open-api/**
        - /doc.html
        - /webjars/**
        - /swagger-resources/**
        - /v3/api-docs/**
